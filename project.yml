name: DuoSlot
options:
  bundleIdPrefix: com.zzzjjj080
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
packages:
  DuoCore:
    path: DuoCore
settings:
  base:
    DEVELOPMENT_TEAM: A7WA598R44
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SP_BUILD_STAMP: ""
targets:
  DuoSlot:
    type: application
    platform: iOS
    sources: [Phone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzjjj080.DuoSlot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Gen/Phone-Info.plist
      properties:
        SPBuildStamp: $(SP_BUILD_STAMP)
        CFBundleDisplayName: Duo Slot
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: DuoSlotWatch
  DuoSlotWatch:
    type: application
    platform: watchOS
    sources: [WatchApp, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzjjj080.DuoSlot.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: "DuoSlot Watch App"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: Gen/Watch-Info.plist
      properties:
        SPBuildStamp: $(SP_BUILD_STAMP)
        WKApplication: true
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: com.zzzjjj080.DuoSlot
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleDisplayName: Duo Slot
        NSHealthShareUsageDescription: iPhone で数えた歩数も合わせて、ヘルスケアと同じ今日の歩数を文字盤に出すために読みます。
        NSHealthUpdateUsageDescription: Duo Slot はヘルスケアへ書き込みません。今日の歩数を読むためだけに使います。
        NSMotionUsageDescription: 今日の歩数を文字盤に出すために、Apple Watch の歩数計を読みます。
        NSCalendarsFullAccessUsageDescription: 次の予定を文字盤に出すために、カレンダーを読みます。
        CFBundleURLTypes:
          - CFBundleURLName: com.zzzjjj080.DuoSlot
            CFBundleURLSchemes: [duoslot]
    entitlements:
      path: Gen/Watch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zzzjjj080.DuoSlot]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: DuoSlotWidget
      - package: DuoCore
  DuoSlotWidget:
    type: app-extension
    platform: watchOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzjjj080.DuoSlot.watchkitapp.Widget
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: DuoCore
    info:
      path: Gen/Widget-Info.plist
      properties:
        CFBundleDisplayName: Duo Slot
        NSHealthShareUsageDescription: iPhone で数えた歩数も合わせて、ヘルスケアと同じ今日の歩数を文字盤に出すために読みます。
        NSHealthUpdateUsageDescription: Duo Slot はヘルスケアへ書き込みません。今日の歩数を読むためだけに使います。
        NSMotionUsageDescription: 今日の歩数を文字盤に出すために、Apple Watch の歩数計を読みます。
        NSCalendarsFullAccessUsageDescription: 次の予定を文字盤に出すために、カレンダーを読みます。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Gen/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zzzjjj080.DuoSlot]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
